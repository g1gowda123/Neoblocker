name: Auto-merge AI PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    
    # Note: If Jules authenticates via your OAuth token, it may open PRs under your username ('g1gowda123').
    # To avoid auto-merging your own manual PRs, it is safer to filter by a label (e.g., 'jules-ai').
    if: contains(github.event.pull_request.labels.*.name, 'jules-ai') || github.event.pull_request.user.login == 'jules[bot]'
    
    steps:
      - name: Auto-approve PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review "$PR_URL" --approve

      - name: Enable Auto-Merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
